<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>得点ビューア</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #000;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <h2>得点状況一覧</h2>
  <table id="score-table">
    <thead>
      <tr>
        <th>問題ID</th>
        <th>内容</th>
        <th>回答チーム</th>
        <th>正解</th>
        <th>得点</th>
        <th>ブロック</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <script>
    const socket = io();

    function updateScoreboard(data) {
      const tbody = $('#score-table tbody');
      tbody.empty();
      for (const [qid, qinfo] of Object.entries(data)) {
        const row = `<tr>
          <td>${qid}</td>
          <td>${qinfo.text}</td>
          <td>${qinfo.team || '-'}</td>
          <td>${qinfo.answered ? '○' : '×'}</td>
          <td>${qinfo.pointget}</td>
          <td>${qinfo.blocked}</td>
          
        </tr>`;
        tbody.append(row);
      }
    }

    // 定期的に状態取得
    setInterval(() => {
      socket.emit('requestScore');
    }, 3000);

    socket.on('scoreData', (questions) => {
      updateScoreboard(questions);
    });
  </script>
</body>
</html>
