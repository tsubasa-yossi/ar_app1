<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css" type="text/css">
  <meta charset="UTF-8">
  <title>ランナー画面</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

</head>
<body>
  <div id="title" class="div_text">ランナー画面</div>
  <div id="tap-button-area" style="display:none">   
    <button id="tap-button">ボタンをタップ（10回）</button>
  </div>
  <div id="tap-count"  class="div_text">0 / 10</div>
  <div id="question-area" style="display:none">
    <p id="question-text"></p>
    <button id="claim-point">ポイント取得</button>
  </div>

  <a-scene embedded arjs='sourceType: webcam;' vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
        <!-- 3Dモデルを読み込む -->
        <a-asset-items id="q_1" src="gltf/問題１.glb"></a-asset-items>
        <a-asset-items id="q_2" src="gltf/問題２.glb"></a-asset-items>
        <a-asset-items id="q_3" src="gltf/問題３.glb"></a-asset-items>
        <a-asset-items id="q_4" src="gltf/問題４.glb"></a-asset-items>
        <a-asset-items id="q_5" src="gltf/問題５.glb"></a-asset-items>
        <a-asset-items id="q_6" src="gltf/問題６.glb"></a-asset-items>
        <a-asset-items id="q_7" src="gltf/問題７.glb"></a-asset-items>
        <a-asset-items id="q_8" src="gltf/問題８.glb"></a-asset-items>
        <a-asset-items id="q_9" src="gltf/問題９.glb"></a-asset-items>
        <a-asset-items id="q_10" src="gltf/問題１０.glb"></a-asset-items>
        <a-asset-items id="q_11" src="gltf/問題１１.glb"></a-asset-items>
        <a-asset-items id="q_12" src="gltf/問題１２.glb"></a-asset-items>
        <a-asset-items id="q_13" src="gltf/問題１３.glb"></a-asset-items>
        <a-asset-items id="q_14" src="gltf/問題１４.glb"></a-asset-items>
    
    </a-assets>
    <a-marker id="marker1" class="marker" type="pattern" url="marker/pattern-01.patt"></a-marker>
    <a-marker id="marker2" class="marker" type="pattern" url="marker/pattern-02.patt"></a-marker>
    <a-marker id="marker3" class="marker" type="pattern" url="marker/pattern-03.patt"></a-marker>
    <a-marker id="marker4" class="marker" type="pattern" url="marker/pattern-04.patt"></a-marker>
    <a-marker id="marker5" class="marker" type="pattern" url="marker/pattern-05.patt"></a-marker>
    <a-marker id="marker6" class="marker" type="pattern" url="marker/pattern-06.patt"></a-marker>
    <a-marker id="marker7" class="marker" type="pattern" url="marker/pattern-07.patt"></a-marker>
    <a-marker id="marker8" class="marker" type="pattern" url="marker/pattern-08.patt"></a-marker>
    <a-marker id="marker9" class="marker" type="pattern" url="marker/pattern-09.patt"></a-marker>
    <a-marker id="marker10" class="marker" type="pattern" url="marker/pattern-10.patt"></a-marker>
    <a-marker id="marker11" class="marker" type="pattern" url="marker/pattern-11.patt"></a-marker>
    <a-marker id="marker12" class="marker" type="pattern" url="marker/pattern-12.patt"></a-marker>
    <a-marker id="marker13" class="marker" type="pattern" url="marker/pattern-13.patt"></a-marker>
    <a-marker id="marker14" class="marker" type="pattern" url="marker/pattern-14.patt"></a-marker>
      <!-- ハズレようのタグ -->
    <a-marker id="marker15" class="marker" type="pattern" url="marker/pattern-15.patt"></a-marker>

    <a-entity camera></a-entity>
  </a-scene>


  <script>
    const socket = io();
    const team = new URLSearchParams(window.location.search).get('team') || 'A';
    let tapCount = new Array(15).fill(0);
    let currentQuestionId = null;
    let q_html = {
      1:'<a-entity position="0 0 0" rotation="20 30 40" scale="0.3 0.3 0.3" gltf-model="#q_1">',
      2:'<a-entity position="0 0 0" rotation="50 0 0" scale="0.3 0.3 0.3" gltf-model="#q_2">',
      3:'<a-entity position="0 0 0" rotation="0 30 0" scale="0.3 0.3 0.3" gltf-model="#q_3">',
      4:'<a-entity position="0 0 0" rotation="0 0 60" scale="0.3 0.3 0.3" gltf-model="#q_4">',
      5:'<a-entity position="0 0 0" rotation="50 70 30" scale="0.3 0.3 0.3" gltf-model="#q_5">',
      6:'<a-entity position="0 0 0" rotation="10 180 70" scale="0.3 0.3 0.3" gltf-model="#q_6">',
      7:'<a-entity position="0 0 0" rotation="-50 30 30" scale="0.3 0.3 0.3" gltf-model="#q_7">',
      8:'<a-entity position="0 0 0" rotation="-20 -30 -40" scale="0.3 0.3 0.3" gltf-model="#q_8">',
      9:'<a-entity position="0 0 0" rotation="10 -90 -50" scale="0.3 0.3 0.3" gltf-model="#q_9">',
      10:'<a-entity position="0 0 0" rotation="20 30 40" scale="0.3 0.3 0.3" gltf-model="#q_10">',
      11:'<a-entity position="0 0 0" rotation="50 30 50" scale="0.3 0.3 0.3" gltf-model="#q_11">',
      12:'<a-entity position="0 0 0" rotation="10 180 70" scale="0.3 0.3 0.3" gltf-model="#q_12">',
      13:'<a-entity position="0 0 0" rotation="50 -180 50" scale="0.3 0.3 0.3" gltf-model="#q_13">',
      14:'<a-entity position="0 0 0" rotation="10 180 70" scale="0.3 0.3 0.3" gltf-model="#q_14">',
            
        // 他の問題のHTMLもここに追加できます
    };

    const markerCount = 15;
    let currentMarker = null;
    let qrId = null;
    // マーカーIDと対応させたオブジェクトを作る
    const markers = {};
    for (let i = 1; i <= markerCount; i++) {
      const markerEl = document.querySelector(`#marker${i}`);
      if (!markerEl) continue;
      markers[`marker${i}`] = {
        el: markerEl,
        id: i,
      };
      markerEl.addEventListener("markerFound", () => onMarkerFound(`marker${i}`));
      markerEl.addEventListener("markerLost", () => onMarkerLost(`marker${i}`));
    }


    // ゲームに参加する
    socket.emit('joinTeam', { team, role: 'runner' });

    // ARタグを発見した後のクリックイベント
    $('#tap-button').on('click', () => {
      tapCount[qrId-1]++;
      $('#tap-count').text(`${tapCount[qrId-1]} / 10`);
      if (tapCount[qrId-1] == 10) {
        //１０回タップしたら問題を表示する
        if (qrId == 15 ){
          console.log("ハズレのQRコードがスキャンされました: ", qrId);
          tapCount[qrId-1] = 0;
          socket.emit('scanAR', { codeId: String(qrId) });
        } else {
          console.log("QRコードがスキャンされました: ", qrId);
          console.log(q_html[qrId]);
          $("#marker"+qrId).html(q_html[qrId]);
        }
        
      }
    });

    socket.on('question', ({ text }) => {
      $('#question-text').text(text);
    });

    $('#claim-point').on('click', () => {
      if (qrId) {
        console.log(`ポイント取得要求: ${qrId}`);
        socket.emit('claimPoint', { codeId: qrId });
      }
    });

    socket.on('pointClaimed', ({ success }) => {
      alert(success ? 'ポイント取得成功！' : '取得失敗：未解答か他チームがブロック');
    });


  // マーカーが見つかったときのイベントリスナー
  // タップボタンの表示と、問題番号を記録する。
  function onMarkerFound(markerName) {
    const marker = markers[markerName];
    if (!marker) return;
    if (currentMarker) return; // 他のマーカーが処理中
    if (!marker.el.object3D.visible) return; // 見えていないなら無視

    currentMarker = markerName;
    qrId = marker.id;
    $('#tap-count').text(`${tapCount[qrId-1]} / 10`);
    console.log(`Marker Found: ${qrId}`);
    $('#question-area').show();
    $("#tap-button-area").show();
  }

  function onMarkerLost(markerName) {
    if (currentMarker === markerName) {
      currentMarker = null;
      qrId = null;
      $('#question-text').text(null);
      $('#tap-count').text(`0 / 10`);
      $('#question-area').hide();
      $("#tap-button-area").hide();
      console.log(`Marker Lost: ${qrId}`);
    }
  }


  </script>
</body>
</html>
