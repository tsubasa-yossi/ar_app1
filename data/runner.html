<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css" type="text/css">
  <meta charset="UTF-8">
  <title>ランナー画面</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <h2>ランナー画面</h2>

  <button id="tap-button">ボタンをタップ（10回）</button>
  <p id="tap-count">0 / 10</p>
  <div id="question-area" style="display:none">
    <p id="question-text"></p>
    <button id="claim-point">ポイント取得</button>
  </div>

  <a-scene embedded arjs='sourceType: webcam;' vr-mode-ui="enabled: false">
    <a-assets>
        <!-- 3Dモデルを読み込む -->
    </a-assets>
    <a-marker id="marker1" class="marker" type="pattern" url="marker/pattern-marker1.patt">
        <a-entity id="marker1_entity" 
            position="0 0 0"
            rotation="-90 0 0"
            scale="0.1 0.1 0.1"
            gltf-model="#soccer"
        >
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const socket = io();
    const team = new URLSearchParams(window.location.search).get('team') || 'A';
    let tapCount = 0;
    let currentQuestionId = null;

    socket.emit('joinTeam', { team, role: 'runner' });

    $('#tap-button').on('click', () => {
      tapCount++;
      $('#tap-count').text(`${tapCount} / 10`);
      if (tapCount >= 10) {
        socket.emit('scanAR', { codeId: '1' });
      }
    });

    socket.on('question', ({ questionId, text }) => {
      currentQuestionId = questionId;
      $('#question-area').show();
      $('#question-text').text(text);
    });

    $('#claim-point').on('click', () => {
      if (currentQuestionId) {
        socket.emit('claimPoint', { questionId: currentQuestionId });
      }
    });

    socket.on('pointClaimed', ({ success }) => {
      alert(success ? 'ポイント取得成功！' : '取得失敗：未解答か他チーム');
    });


  </script>
</body>
</html>
