<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>チームとロール選択</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #e3f2fd; /* 青系の背景 */
        color: #0d47a1;
    }
    h2 {
        margin-top: 20px;
    }
    #freeze-message {
        color: red;
        font-weight: bold;
    }
    select, input, button {
        display: block;
        width: 80%;
        max-width: 300px;
        margin: 10px auto;
        padding: 10px;
        font-size: 18px;
        border-radius: 8px;
        border: 2px solid #0d47a1;
    }
    select {
        background-color: #bbdefb;
    }
    input {
        background-color: #ffffff;
    }
    button {
        background-color: #0d47a1;
        color: white;
        cursor: pointer;
    }
    button:hover {
        background-color: #1565c0;
    }
</style>
</head>
<body>
  <h2>ゲーム参加</h2>
  <label>チーム選択:</label>
  <select id="team-select">
    <option value="A">チームA</option>
    <option value="B">チームB</option>
  </select>
  <br>
  <label>ロール選択:</label>
  <select id="role-select">
    <option value="hacker">ハッカー</option>
    <option value="runner">ランナー</option>
    <option value="defender">ディフェンダー</option>
    <option value="viewer">オブザーバー</option>
    <option value="master">管理者</option>
  </select>
  <br>
  <button id="start-btn">参加</button>

  <script>
    const socket = io();
    $('#start-btn').on('click', function () {
      const team = $('#team-select').val();
      const role = $('#role-select').val();
      if (role === 'master') {
        // 管理者は特別なページにリダイレクト
        window.location.href = 'master.html';
        return;
      }else if (role === 'viewer') {
        // オブザーバーは特別なページにリダイレクト
        window.location.href = 'viewer.html';
        return;
      } else {
        window.location.href = `${role}.html?team=${team}`;
        // socket.emit('joinTeam', { team, role });
      }
    });


  </script>
</body>
</html>
