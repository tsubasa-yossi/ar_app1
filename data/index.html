<!DOCTYPE html>
<html>
  <head>
    <title>Marker Based AR with AR.js and Three.js</title>
    <style>
      .button {
        position: absolute;
        text-align: center;
        width: 50%;
        height: 15%;
        border: 8px double #0090bb;
      }
      a{
        display:block;
        position: relative;
        margin: 0 auto;
        width: 100%;
        height: 100%;
        top: 50%;
        line-height: 15%;
        font-size: 200%;
        color: #000;
        text-decoration: none;
      }
      #a1 {
        top: 5%;
        left: 25%;
      }
      #a2 {
        top: 25%;
        left: 25%;
      }
      #a3 {
        top: 45%;
        left: 25%;
      }
      #a4 {
        top: 65%;
        left: 25%;
      }
    </style>
  </head>
  <body>
    <div class="button" id="a1">
      <a href="http://localhost:3000/">管理者</a>
    </div>
    <div class="button" id="a2">
      <a href="http://localhost:3000/index1.html">チーム１</a>
    </div>
    <div class="button" id="a3">
      <a href="http://localhost:3000/index2.html">チーム２</a>
    </div>
    <div class="button" id="a4">
      <a href="http://localhost:3000/">オブザーバー</a>
    </div>
